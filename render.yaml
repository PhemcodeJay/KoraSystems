services:
  - type: web
    name: korasystems
    runtime: node
    plan: free
    rootDir: .
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start --filter=admin
    preDeployCommand: pnpm --filter @kora/database migrate:deploy
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: kora-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: kora-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: DISBURSEMENT_PROVIDER
        value: simulated
      - key: KORA_DEMO_PASSWORD
        value: ""
      - key: KORA_ALLOW_DEMO_LOGIN
        value: ""
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        fromSecret: gmail-user
      - key: SMTP_PASS
        fromSecret: gmail-app-password
      - key: EMAIL_FROM
        value: "Kora Growth <no-reply@korasystems.com>"
      - key: TWILIO_ACCOUNT_SID
        fromSecret: twilio-account-sid
      - key: TWILIO_AUTH_TOKEN
        fromSecret: twilio-auth-token
      - key: TWILIO_WHATSAPP_FROM
        value: "whatsapp:+14155238886"

databases:
  - name: kora-db
    databaseName: kora
    plan: free