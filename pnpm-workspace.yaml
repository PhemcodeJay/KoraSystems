# The workspace is now exactly the platform: one app and the five packages it
# depends on. Everything else — the Docker definitions, the vendored Express/PHP
# services and the standalone client apps — has been removed, so there are no
# exclusions left to maintain.
packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/client': set this to true or false
  '@prisma/engines': set this to true or false
  esbuild: set this to true or false
  prisma: set this to true or false
  unrs-resolver: set this to true or false
